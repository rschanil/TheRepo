<title>SYNTHCORE</title>
<style>
/* Single deliberate look: green phosphor on a black tube, red bezel frames. */
:root {
  --bg:        #020403;
  --panel:     #040906;
  --well:      #030704;
  --border:    #12301a;
  --frame:     #b8322a;
  --ph:        #3dff6e;
  --ph-hi:     #d2ffdc;
  --ph-dim:    #1f8a3e;
  --ph-faint:  #0c2413;
  --glow:      rgba(61, 255, 110, 0.45);
  --osc:       #3dff6e;
  --filter:    #3dff6e;
  --env:       #3dff6e;
  --fx:        #3dff6e;
  --mod:       #ffb000;
  --label:     #3cc466;
  --value:     #8dffac;
  --active:    #d2ffdc;
  --danger:    #ff453a;
  --knob:      #051009;
  --track:     #0d2615;
  --muted:     #2a8a45;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: var(--mono);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--value); }
body {
  margin: 0;
  font: 13px/1.4 var(--mono);
  padding-inline: 16px;
  padding-block: 12px 40px;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(61, 255, 110, 0.06), transparent 60%),
    var(--bg);
}
/* faint scanlines over the whole instrument */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--ph-hi); outline-offset: 2px; box-shadow: 0 0 8px var(--glow); }
#app { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.glow { text-shadow: 0 0 6px var(--glow); }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--border); border-bottom-color: var(--frame);
  padding: 10px 14px;
}
.brand { display: flex; flex-direction: column; gap: 4px; margin-right: 6px; }
.wordmark {
  font: 800 21px/1 var(--mono); letter-spacing: .42em; color: var(--ph);
  text-shadow: 0 0 4px var(--ph), 0 0 14px var(--glow), 0 0 28px rgba(61, 255, 110, .25);
}
.brand small { font: 500 9.5px/1 var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.presets { display: flex; flex-wrap: wrap; gap: 4px; }
.presets button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  min-width: 74px; padding: 4px 8px;
  background: var(--well); border: 1px solid var(--border); text-align: left;
}
.presets button b { font: 600 9px var(--mono); color: var(--muted); letter-spacing: .1em; }
.presets button span { font-size: 11.5px; color: var(--label); white-space: nowrap; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
.presets button:hover { border-color: var(--ph-dim); }
.presets button.on { border-color: var(--ph); background: color-mix(in srgb, var(--ph) 10%, var(--well)); box-shadow: 0 0 10px rgba(61, 255, 110, .18) inset; }
.presets button.on span { color: var(--ph-hi); text-shadow: 0 0 6px var(--glow); }
.presets button.on b { color: var(--ph); }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.group > label { font: 600 9.5px var(--mono); letter-spacing: .14em; color: var(--label); text-transform: uppercase; }
.txt {
  background: #000; border: 1px solid var(--border);
  padding: 5px 7px; font: 12px var(--mono); color: var(--ph); min-width: 0;
  text-shadow: 0 0 6px var(--glow); caret-color: var(--ph);
}
#presetName { width: 124px; }
.sel.lib { padding: 5px 6px; font-size: 11.5px; max-width: 190px; border-color: var(--ph-dim); }
.sel.lib optgroup { color: var(--frame); font-style: normal; }
#bpm { width: 64px; font-variant-numeric: tabular-nums; }
.btn {
  background: var(--knob); border: 1px solid var(--border);
  padding: 5px 10px; font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--label);
}
.btn:hover { color: var(--ph-hi); border-color: var(--ph-dim); text-shadow: 0 0 6px var(--glow); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 16%, var(--knob)); color: #fff; text-shadow: 0 0 6px var(--danger); }
.status { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pill {
  font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
  padding: 4px 8px; border: 1px solid var(--border); color: var(--label); white-space: nowrap;
}
/* Fixed width: its text changes on the first tap, and a reflow there would move the
   button under the finger between press and release. */
#audioState { width: 28ch; max-width: 100%; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.pill.live { color: var(--ph); border-color: var(--ph-dim); text-shadow: 0 0 6px var(--glow); }
.pill.warn { color: var(--mod); border-color: color-mix(in srgb, var(--mod) 40%, var(--border)); }
.pill.err { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
.cpu { display: flex; align-items: center; gap: 6px; font: 600 10px var(--mono); color: var(--label); letter-spacing: .08em; }
.cpu .bar { width: 54px; height: 6px; background: var(--track); overflow: hidden; }
.cpu .bar i { display: block; height: 100%; width: 0; background: var(--ph); box-shadow: 0 0 6px var(--glow); transition: width .2s linear; }
.cpu output { width: 34px; text-align: right; font-variant-numeric: tabular-nums; color: var(--value); }

/* ---------- CRT screens ---------- */
.screens { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.crt { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tube {
  position: relative; background: #000; border: 1px solid var(--frame);
  box-shadow: 0 0 0 1px #000 inset, 0 0 18px rgba(184, 50, 42, .12);
  overflow: hidden; max-width: 100%;
  /* graticule lives behind the canvas so the phosphor fade never erases it */
  background-image:
    linear-gradient(rgba(61, 255, 110, .09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61, 255, 110, .09) 1px, transparent 1px),
    linear-gradient(rgba(61, 255, 110, .16) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61, 255, 110, .16) 1px, transparent 1px);
  background-size: 100% 12.5%, 10% 100%, 100% 50%, 50% 100%;
  background-position: -1px -1px, -1px -1px, 0 calc(50% - .5px), calc(50% - .5px) 0;
}
.tube::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, .28) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .65) 100%);
}
.tube canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; max-width: 100%; }
.tube-wide canvas.bode { aspect-ratio: 4 / 1; }
#arpView { aspect-ratio: 48 / 11; }
.crt-wide { margin-top: 12px; }
.spec-tube canvas { aspect-ratio: 7 / 1; }
.faxis { position: absolute; inset: 0; pointer-events: none; }
.faxis span { position: absolute; right: 6px; transform: translateY(-50%); font: 600 9px var(--mono); color: var(--label); text-shadow: 0 0 4px #000, 0 0 2px #000; }
.faxis span::before { content: ""; position: absolute; right: calc(100% + 4px); top: 50%; width: 8px; height: 1px; background: var(--ph-dim); }
#spectro { cursor: crosshair; }
.scopectl { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px; margin-top: 12px; }
.rng { display: flex; flex-direction: column; gap: 4px; }
.rng .lbl { text-align: left; }
.rng input { width: 150px; max-width: 100%; accent-color: var(--ph); }
.rng output { font: 11px var(--mono); color: var(--value); font-variant-numeric: tabular-nums; }
.rng { position: relative; }
.rng output { position: absolute; right: 0; top: 0; font-size: 10px; }
#crtCost { margin-left: auto; font-variant-numeric: tabular-nums; }
.tube-wide { background-image: none; }
.crt figcaption {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--label);
}
.crt figcaption b { color: var(--frame); font-weight: 700; }
.crt figcaption span { margin-left: auto; color: var(--muted); letter-spacing: .06em; text-transform: none; font-variant-numeric: tabular-nums; }

/* ---------- panels ---------- */
.panel {
  --acc: var(--ph);
  background: var(--panel); border: 1px solid var(--border);
  padding: 12px 14px 14px;
}
.panel > h2 {
  margin: 0; font: 700 11px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--ph);
  text-shadow: 0 0 6px var(--glow);
}
.ph {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: 0; padding: 2px 0; margin: 0; text-align: left; cursor: pointer;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; text-shadow: inherit;
}
.ph::before { content: ""; width: 6px; height: 6px; background: var(--frame); box-shadow: 0 0 6px var(--frame); flex: none; }
.ph::after { content: ""; order: 1; flex: 1; min-width: 12px; height: 1px; background: linear-gradient(90deg, var(--ph-dim), transparent); opacity: .6; }
.ph small { order: 2; font-weight: 500; letter-spacing: .06em; color: var(--muted); text-transform: none; font-size: 10.5px; text-shadow: none; line-height: 1.3; }
.ph .chev {
  order: 3; flex: none; width: 18px; height: 18px; display: grid; place-items: center;
  border: 1px solid var(--border); color: var(--ph); font-size: 10px; letter-spacing: 0;
}
.ph .chev::before { content: "▾"; transition: transform .15s ease; }
.ph:hover .chev { border-color: var(--ph-dim); }
.panel.folded .ph .chev::before { transform: rotate(-90deg); }
.panel.folded { padding-bottom: 12px; }
.pbody { margin-top: 12px; }
[hidden] { display: none !important; }
/* Simple view shows presets, quick knobs, displays, Claude, arp, chords, keyboard;
   Advanced shows every panel. Controls are shared, so both stay in sync. */
body.view-simple .adv-only, body.view-adv .simple-only { display: none; }
.viewsw button { padding: 4px 8px; }
.mods { display: flex; flex-wrap: wrap; gap: 10px; }
.mod {
  background: var(--well); border: 1px solid var(--border);
  padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px;
  flex: 1 1 auto; min-width: 0;
}
.mod-bode, .mod-arpview { flex: 1 1 340px; }
.mod > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.mod h3 { margin: 0; font: 700 10px/1 var(--mono); letter-spacing: .16em; color: var(--label); text-transform: uppercase; }
.mod h3 em { font-style: normal; color: var(--frame); margin-right: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: flex-start; }
.hint { margin: 0; font-size: 11px; color: var(--muted); max-width: 44ch; }
.dim { opacity: .3; }

/* ---------- knob ---------- */
.knob { display: flex; flex-direction: column; align-items: center; width: 54px; gap: 1px; user-select: none; -webkit-user-select: none; }
.knob svg { width: 44px; height: 44px; cursor: ns-resize; touch-action: none; display: block; overflow: visible; }
.knob.lg { width: 70px; }
.knob.lg svg { width: 60px; height: 60px; }
.kn-body { fill: #010402; stroke: var(--ph-faint); stroke-width: 1; }
.kn-track { fill: none; stroke: var(--track); stroke-width: 3; stroke-linecap: butt; }
.kn-val { fill: none; stroke: var(--ph); stroke-width: 3; stroke-linecap: butt; filter: drop-shadow(0 0 2.5px var(--ph)); }
.kn-dot { fill: var(--ph-hi); filter: drop-shadow(0 0 2px var(--ph)); }
.knob svg:focus-visible { outline-offset: 0; border-radius: 50%; }
.lbl { font: 600 9px/1.2 var(--mono); letter-spacing: .1em; color: var(--label); text-transform: uppercase; text-align: center; white-space: nowrap; }
.val { font: 11px/1.2 var(--mono); color: var(--value); font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 0 5px var(--glow); }
.learning svg, .learning .sl-track { animation: learn .7s ease-in-out infinite alternate; }
.learning .lbl { color: var(--mod); }
.seg.learning, .tog.learning { box-shadow: 0 0 0 2px var(--mod); }
.learned .lbl::after { content: " ●"; color: var(--mod); }
@keyframes learn { from { filter: drop-shadow(0 0 0 var(--mod)); } to { filter: drop-shadow(0 0 5px var(--mod)); } }

/* ---------- sliders ---------- */
.slider { display: flex; align-items: center; user-select: none; -webkit-user-select: none; gap: 4px; }
.slider.v { flex-direction: column; width: 40px; }
.slider.h { flex-direction: row; min-width: 0; }
.sl-track { position: relative; background: var(--track); touch-action: none; cursor: pointer; }
.slider.v .sl-track { width: 6px; height: 86px; cursor: ns-resize; }
.slider.h .sl-track { height: 6px; width: 100%; min-width: 90px; flex: 1; cursor: ew-resize; }
.sl-fill { position: absolute; background: var(--ph); box-shadow: 0 0 6px var(--glow); }
.slider.v .sl-fill { left: 0; right: 0; }
.slider.h .sl-fill { top: 0; bottom: 0; }
.sl-thumb { position: absolute; background: var(--ph-hi); box-shadow: 0 0 0 2px var(--bg), 0 0 8px var(--ph); }
.slider.v .sl-thumb { left: -5px; right: -5px; height: 4px; transform: translateY(50%); }
.slider.h .sl-thumb { top: -5px; bottom: -5px; width: 4px; transform: translateX(-50%); }
.slider.h .val { width: 44px; text-align: right; }
.slider.fader .sl-track { height: 150px; width: 8px; }

/* ---------- segmented, toggles, selects ---------- */
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); overflow: hidden; background: var(--knob); max-width: 100%; }
.seg button {
  background: transparent; border: 0; border-right: 1px solid var(--border);
  padding: 5px 8px; font: 600 10px/1.1 var(--mono); letter-spacing: .06em; color: var(--label);
  display: inline-flex; align-items: center; gap: 5px;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ph-hi); }
.seg button.on { background: var(--ph); color: #010a03; box-shadow: 0 0 12px var(--glow); }
.seg button svg { width: 18px; height: 11px; display: block; }
.seg button svg polyline { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.seg.icons button { padding: 5px 7px; }
.tog {
  background: var(--knob); border: 1px solid var(--border);
  padding: 5px 9px; font: 600 10px/1.1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--label);
  display: inline-flex; align-items: center; gap: 6px;
}
.tog::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--track); border: 1px solid var(--ph-faint); }
.tog:hover { color: var(--ph-hi); }
.tog.on { color: var(--ph-hi); border-color: var(--ph-dim); text-shadow: 0 0 6px var(--glow); }
.tog.on::before { background: var(--ph); border-color: var(--ph); box-shadow: 0 0 8px var(--ph); }
.selw { display: flex; flex-direction: column; gap: 3px; }
.sel { background: #000; border: 1px solid var(--border); padding: 4px 6px; font: 11px var(--mono); color: var(--ph); max-width: 100%; }
.sel option { background: #020703; color: var(--ph); }
.cyc { min-width: 44px; justify-content: center; }
.cyc::before { display: none; }

/* ---------- envelopes & lfos ---------- */
.strips { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 10px; }
.env-view { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
canvas.adsr { width: 160px; height: 60px; background: #000; border: 1px solid var(--frame); display: block; max-width: 100%; }
.sliders { display: flex; gap: 2px; }

/* ---------- mod matrix ---------- */
.mm-wrap { overflow-x: auto; }
table.mm { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 12px; }
table.mm th { font: 600 9px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; text-align: left; padding: 0 6px 6px; }
table.mm td { padding: 3px 6px; border-top: 1px solid var(--border); vertical-align: middle; }
table.mm td.n { font: 600 10px var(--mono); color: var(--muted); width: 26px; font-variant-numeric: tabular-nums; }
table.mm tr.live td.n { color: var(--ph); text-shadow: 0 0 6px var(--glow); }
table.mm .sel { width: 100%; }
table.mm td.d { width: 34%; }
table.mm input[type=checkbox] { accent-color: var(--ph); width: 15px; height: 15px; }

/* ---------- master ---------- */
.meters { display: flex; gap: 10px; align-items: flex-end; }
.vu { display: flex; gap: 4px; align-items: flex-end; }
.vu canvas { width: 20px; height: 120px; display: block; background: #000; border: 1px solid var(--border); }
.vu-scale { position: relative; height: 120px; width: 30px; font: 9px var(--mono); color: var(--muted); }
.vu-scale span { position: absolute; right: 0; transform: translateY(-50%); white-space: nowrap; }
.vu-cap { font: 600 9px var(--mono); color: var(--muted); letter-spacing: .1em; text-align: center; }
.gr { display: flex; align-items: center; gap: 8px; font: 11px var(--mono); color: var(--label); }
.gr .bar { position: relative; flex: 1; min-width: 80px; height: 6px; background: var(--track); overflow: hidden; }
.gr .bar i { position: absolute; right: 0; top: 0; bottom: 0; width: 0; background: var(--mod); box-shadow: 0 0 6px var(--mod); }
.gr output { width: 58px; text-align: right; color: var(--value); font-variant-numeric: tabular-nums; }

/* ---------- chords ---------- */
.chd { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.chd-ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start; flex: 1 1 380px; min-width: 0; }
.chd-ctl .lbl { text-align: left; }
.chd-togs { display: flex; flex-direction: column; gap: 6px; }
.chd-pads { display: flex; gap: 8px; flex: 1 1 380px; min-width: 0; align-items: stretch; }
.chd-play { flex: none; min-width: 74px; }
.chd-play.on { color: #010a03; background: var(--ph); border-color: var(--ph); box-shadow: 0 0 12px var(--glow); text-shadow: none; }
.pads { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.pad {
  position: relative; min-height: 64px; padding: 6px 8px; background: #000; border: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 4px;
  touch-action: none; user-select: none; -webkit-user-select: none; text-align: left;
}
.pad:hover { border-color: var(--ph-dim); }
.pad b { position: absolute; top: 5px; right: 7px; font: 600 9px var(--mono); color: var(--muted); }
.pad .num { font: 700 15px/1 var(--mono); color: var(--frame); letter-spacing: .02em; }
.pad .nm { font: 600 12px/1 var(--mono); color: var(--value); white-space: nowrap; text-shadow: 0 0 5px var(--glow); }
.pad.on { background: color-mix(in srgb, var(--ph) 22%, #000); border-color: var(--ph); box-shadow: 0 0 14px var(--glow), inset 0 0 18px rgba(61, 255, 110, .25); }
.pad.on .nm { color: var(--ph-hi); }
.pad.on .num { color: #ff6a5e; }

/* ---------- Claude plays ---------- */
.cl { display: flex; flex-direction: column; gap: 10px; }
.cl-ask { display: flex; gap: 8px; }
.cl-ask .txt { flex: 1; min-width: 0; font-size: 13px; padding: 8px 10px; }
.cl-go { min-width: 110px; color: #010a03; background: var(--ph); border-color: var(--ph); text-shadow: none; box-shadow: 0 0 12px var(--glow); }
.cl-go:hover { color: #010a03; background: var(--ph-hi); }
.cl-go:disabled { opacity: .3; box-shadow: none; cursor: not-allowed; }
.cl-go.busy { background: var(--knob); color: var(--mod); border-color: var(--mod); box-shadow: none; }
.cl-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: #000; border: 1px solid var(--border); color: var(--label); font: 11px var(--mono); padding: 4px 9px; border-radius: 999px; }
.chip:hover { color: var(--ph-hi); border-color: var(--ph-dim); }
.cl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.cl-play.on { color: #010a03; background: var(--ph); border-color: var(--ph); text-shadow: none; }
.cl-keep { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--label); }
.cl-keep input { accent-color: var(--ph); }
.cl-pieces { margin-left: auto; }
.cl-pieces .sel { max-width: 260px; }
.cl-tube canvas { aspect-ratio: 960 / 150; }
.cl-cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font: 11px var(--mono); color: var(--muted); }
.cl-cap b { font: 700 13px var(--mono); color: var(--ph); text-shadow: 0 0 6px var(--glow); letter-spacing: .04em; }
.cl-knobs { display: flex; flex-wrap: wrap; gap: 4px 6px; font: 10.5px var(--mono); color: var(--label); }
.cl-knobs:empty { display: none; }
.cl-knobs .h { color: var(--mod); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px; margin-right: 2px; align-self: center; }
.cl-knobs .k { border: 1px solid color-mix(in srgb, var(--mod) 35%, var(--border)); padding: 2px 6px; color: var(--value); white-space: nowrap; }
